name: Sync & Deploy Encrypted Q3 Booster Up

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q3-Booster-Up
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync data from ariswidodo/EPR
        run: python scripts/sync_from_epr_repo.py --source github

      - name: Encrypt booster_data.json to booster_data.enc
        run: node scripts/encrypt_data.mjs

      - name: Publish minimal encrypted site to gh-pages
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/booster_data.enc _site/data/
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: encrypted Q3 Booster Up site"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
